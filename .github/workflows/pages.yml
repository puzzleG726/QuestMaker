name: Publish QuestMaker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check source syntax
        run: node --check app.js
      - name: Scan tracked source for credentials
        run: node scripts/security-check.cjs --tracked
      - name: Stage public files only
        run: |
          mkdir -p _site/vendor
          cp index.html app.js styles.css LICENSE _site/
          cp vendor/README.md vendor/html2canvas.min.js vendor/html2canvas-LICENSE vendor/lucide.min.js vendor/lucide-LICENSE _site/vendor/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
